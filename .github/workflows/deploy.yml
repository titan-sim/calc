name: Deploy to Cloudflare Workers

# main에 푸시될 때마다 자동으로 wrangler deploy를 실행해서 실제 서비스(dinomutant-sim.com)에
# 그대로 반영함 - 예전엔 이 저장소를 깃허브에 푸시하는 것과 실제 사이트 배포가 완전히 분리된
# 수동 작업이라 "푸시했는데 왜 사이트는 그대로냐"는 혼란이 반복됐음(사용자 확정으로 자동화함).
# CLOUDFLARE_API_TOKEN은 저장소 Settings > Secrets and variables > Actions에 등록된 값을 씀 -
# 코드에는 절대 값 자체가 노출되지 않음.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # version.json(js/core/update-check.js가 폴링하는 배포 버전 마커)을 커밋마다 손으로 바꿔주는
      # 수동 절차였는데, 실제로는 이 저장소가 생긴 뒤 딱 한 번만 바뀌고 그 뒤 수십 번의 자동 배포
      # 동안 한 번도 안 바뀜(git log로 확인) - 그래서 "새 배포 감지 배너"가 사실상 한 번도 못 뜬
      # 것으로 보임(사용자 리포트로 발견). 사람이 기억해야 하는 절차 자체를 없애고, 배포마다 항상
      # 달라지는 커밋 SHA로 매 배포 시점에 자동 생성함
      - name: Write version.json
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          printf '{ "version": "%s" }\n' "$APP_VERSION" > version.json
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          # wrangler-action이 버전을 안 정해주면 3.90.0으로 떨어지는데, 그 버전은 이 프로젝트처럼
          # main(진입점 스크립트) 없이 assets(정적 파일)만 배포하는 방식을 지원 안 해서
          # "Missing entry-point" 에러가 남(로컬에서 쓴 4.120.0에서는 문제없이 되던 것과 대조돼서
          # 실측으로 원인 확인) - 로컬과 같은 계열인 4.x로 명시 고정
          wranglerVersion: "4"
