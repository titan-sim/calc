<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>3D 공간 검증 데모</title>
<!-- 이 페이지는 프로덕션 라우터(js/router.js)와 무관한 독립 실행 페이지 - 실제 게임 페이지를
     건드리기 전에 "진짜 3D 공간"(육각형 바닥, 오브젝트의 바닥 정렬, 카메라 팬/줌, 빌보드
     스프라이트, DOM 오버레이)이 제대로 동작하는지만 먼저 검증하기 위한 용도. .assetsignore에
     dev/ 를 추가해서 실제 배포에는 안 올라감.
     카메라는 자유 회전(OrbitControls)이 아니라 고정 각도 드래그 팬 + 휠 줌 방식(전략 게임류와
     동일한 카메라 조작감, 사용자가 제미나이로 다듬은 2차 초안 반영) - 별도 컨트롤 라이브러리
     없이 space3d-demo.js 안에서 레이캐스터로 직접 구현함 -->
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    font-family: system-ui, sans-serif; font-size: 13px; color: #e5e9f0;
    background: rgba(11, 18, 32, 0.75); border: 1px solid #2a3444; border-radius: 8px;
    padding: 10px 14px; line-height: 1.6; white-space: pre; pointer-events: none;
  }
  #checks {
    position: fixed; top: 12px; right: 12px; z-index: 10; max-width: 340px;
    font-family: system-ui, sans-serif; font-size: 12.5px; color: #e5e9f0;
    background: rgba(11, 18, 32, 0.85); border: 1px solid #2a3444; border-radius: 8px;
    padding: 10px 14px; line-height: 1.7;
  }
  #checks .pass { color: #6cf27a; }
  #checks .fail { color: #ff6b5e; }
  /* Vector3.project(camera)로 3D->2D 변환한 좌표에 그대로 얹는 순수 DOM 라벨 - 3D 변환/원근을
     전혀 안 씀(캔버스 밖의 일반 2D 요소), Three.js가 매 프레임 계산해주는 화면 좌표만 받아씀 */
  .dom-label {
    position: fixed; z-index: 5; transform: translate(-50%, -100%);
    font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9); pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="hud"></div>
<div id="checks"></div>

<!-- Three.js (CDN, 번들러 불필요 - 이 사이트의 "빌드 스텝 없음" 원칙과 호환). 카메라 조작을
     고정 각도 드래그 팬 + 휠 줌으로 직접 구현하므로 OrbitControls는 더 이상 안 씀 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="space3d-demo.js"></script>
</body>
</html>
